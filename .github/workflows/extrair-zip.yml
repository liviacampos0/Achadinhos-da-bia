
name: Extrair ZIP

on:
  push:
    paths:
      - '**/achadinhos-bia.zip'
      - '.github/workflows/extrair-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto
        run: |
          ZIP=$(find . -type f -iname "achadinhos-bia.zip" -not -path "./.git/*" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP não encontrado"
            find . -type f
            exit 1
          fi

          mkdir /tmp/projeto
          unzip -o "$ZIP" -d /tmp/projeto

          CONFIG=$(find /tmp/projeto -name netlify.toml -print -quit)
          if [ -z "$CONFIG" ]; then
            echo "Não encontrei netlify.toml dentro do ZIP"
            find /tmp/projeto -type f
            exit 1
          fi

          ROOT=$(dirname "$CONFIG")
          cp -a "$ROOT/." .

      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair projeto do catálogo" || echo "Sem alterações"
          git push
