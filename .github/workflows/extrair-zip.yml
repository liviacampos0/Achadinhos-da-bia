
name: Extrair ZIP

on:
  push:
    paths:
      - 'achadinhos-bia.zip'
      - '.github/workflows/extrair-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair ZIP
        run: |
          unzip -o achadinhos-bia.zip -d .

      - name: Salvar arquivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair arquivos do catálogo" || echo "Sem alterações"
          git push
