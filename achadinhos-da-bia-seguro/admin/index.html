<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel da Bia</title><style>body{font-family:Arial;background:#fff7fa;color:#51424a;margin:0;padding:20px}.box{max-width:700px;margin:25px auto;background:white;padding:20px;border:1px solid #f2d7e3;border-radius:16px}input,select,button{box-sizing:border-box;padding:12px;margin:6px 0;width:100%;border:1px solid #e6cbd8;border-radius:9px;font:inherit}button{background:#cf72a0;color:white;font-weight:bold;border:0}article{padding:12px;border:1px solid #f2d7e3;border-radius:10px;margin:10px 0}.row{display:flex;gap:8px}.row button{width:auto;flex:1}.hint{font-size:13px;color:#806d77}</style></head><body><div class="box"><h1>Área da Bia 🎀</h1><div id="login"><p>Entre com sua senha de administradora.</p><input id="password" type="password" placeholder="Sua senha"><button id="enter">Entrar</button></div><div id="app" hidden><p id="status" class="hint">Alterações salvas no catálogo público ao tocar em Salvar alterações.</p><h2>Produtos</h2><div id="list"></div><h2>Adicionar / editar produto</h2><input id="name" placeholder="Nome do produto"><select id="category"><option value="natal">Natal</option><option value="cozinha">Artigos para cozinha</option><option value="beleza">Beleza</option><option value="casa">Casa</option><option value="outros">Outros</option></select><input id="link" placeholder="Link da Shopee"><input id="image" type="file" accept="image/*"><div class="row"><button id="save">Salvar produto</button><button id="clear">Limpar</button></div><button id="publish">Salvar alterações no catálogo público</button><button id="logout">Sair</button></div></div><script>let products=[],editId=null;const $=x=>document.getElementById(x);async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Erro');return d}function render(){ $('list').innerHTML=products.map(p=>`<article><b>${esc(p.name)}</b><div class="row"><button onclick="edit('${p.id}')">Editar</button><button onclick="removeP('${p.id}')">Excluir</button></div></article>`).join('')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.edit=id=>{let p=products.find(x=>x.id===id);if(!p)return;editId=id;$('name').value=p.name;$('category').value=p.category;$('link').value=p.link};window.removeP=id=>{products=products.filter(p=>p.id!==id);render()};$('enter').onclick=async()=>{try{await api('/.netlify/functions/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').hidden=true;$('app').hidden=false;let d=await api('/.netlify/functions/catalog');products=d.products||[];render()}catch(e){alert(e.message)}};$('save').onclick=async()=>{let name=$('name').value.trim(),link=$('link').value.trim();if(!name||!link){alert('Preencha nome e link.');return}let image='';const f=$('image').files[0];if(f)image=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});let p=products.find(x=>x.id===editId);if(p){p.name=name;p.category=$('category').value;p.link=link;if(image)p.image=image}else products.push({id:'p'+Date.now(),name,category:$('category').value,link,image,emoji:'🎀'});editId=null;$('name').value='';$('link').value='';$('image').value='';render()};$('clear').onclick=()=>{editId=null;$('name').value='';$('link').value='';$('image').value=''};$('publish').onclick=async()=>{try{await api('/.netlify/functions/catalog',{method:'PUT',body:JSON.stringify({products})});$('status').textContent='Catálogo atualizado com sucesso!';alert('Alterações publicadas!')}catch(e){alert(e.message)}};$('logout').onclick=async()=>{await api('/.netlify/functions/logout',{method:'POST'});location.reload()};</script></body></html>
